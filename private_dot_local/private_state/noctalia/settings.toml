config_version = 14

[bar.default]
center = [ "control-center", "spacer_2", "workspaces", "spacer_2", "session" ]
end = [ "tray", "network", "volume", "media" ]
start = [ "group:g1" ]

    [[bar.default.capsule_group]]
    accordion = false
    accordion_direction = "end"
    border = ""
    border_width = 1.0
    enabled = true
    fill = "surface"
    id = "g1"
    members = [ "date", "clock" ]
    opacity = 1.0
    padding = 6.0

[location]
address = "Asnieres-sur-Seine, France"

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@DP-2", "lockscreen-login-box@HDMI-A-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-2"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 898.0
    output = "DP-2"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-2".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 898.0
    output = "HDMI-A-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[shell]
avatar_path = "/home/thosu/Pictures/ProfilPictures/666eb6d119d1c7fa30be9af3da7d22e1.jpg"

    [shell.greeter_sync]
    auto_sync = true

[theme]
builtin = "Noctalia"
community_palette = "Oxocarbon"
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "soft"

    [theme.templates]
    builtin_ids = [
        "alacritty",
        "btop",
        "cava",
        "emacs",
        "foot",
        "gtk3",
        "gtk4",
        "ghostty",
        "helix",
        "hyprland",
        "kcolorscheme",
        "kitty",
        "labwc",
        "mango",
        "niri",
        "qt",
        "scroll",
        "starship",
        "sway",
        "umbriel",
        "wezterm"
    ]

[wallpaper]
directory = "/home/thosu/Pictures/Wallpapers"
transition = [ "disc" ]
transition_on_startup = true

    [wallpaper.default]
    path = "/home/thosu/Pictures/Wallpapers/train-cloud.webp"

    [wallpaper.last]
    path = "/home/thosu/Pictures/Wallpapers/train-cloud.webp"

    [wallpaper.monitors.DP-2]
    path = "/home/thosu/Pictures/Wallpapers/train-cloud.webp"

    [wallpaper.monitors.HDMI-A-1]
    path = "/home/thosu/Pictures/Wallpapers/train-cloud.webp"

[widget.media]
enabled = false
hide_when_no_media = true
rotate_album_art = true
show_progress = true
title_scroll = "on_hover"

[widget.network]
show_label = false

[widget.session]
capsule_radius = "auto"

[widget.spacer_2]
length = 12
type = "spacer"

[widget.sysmon]
visualization = "none"

[widget.temp]
show_glyph = false

[widget.tray]
drawer = true